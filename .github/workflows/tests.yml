name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-tests:
    name: laravel-tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    env:
      BACKUP_NOTIFICATION_EMAIL: backup-ci@example.test
      MAIL_MAILER: array

    strategy:
      fail-fast: false
      matrix:
        # Production runs 8.4; 8.5 keeps us forward-compatible.
        php: ['8.4', '8.5']

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, dom, curl, libxml, pdo_pgsql, bcmath
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Verify Committed Prebuilt Assets
      run: php -d memory_limit=256M scripts/prebuilt-assets.php

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Linting (Pint)
      run: ./vendor/bin/pint --test

    - name: Run Static Analysis (PHPStan)
      run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=2G

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install NPM Dependencies
      run: npm ci

    - name: Build Assets
      run: npm run build

    - name: Verify Prebuilt Assets
      run: php -d memory_limit=256M scripts/prebuilt-assets.php

    - name: Run JS Linting
      run: npm run lint

    - name: Execute tests
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: testing
        DB_USERNAME: postgres
        DB_PASSWORD: password
      run: php artisan test
